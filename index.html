<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmundo Murima - Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Civil & Web Engineering Store</h1>
    <p>Author: Edmundo Murima</p>

    
    <div class="product-container">
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>Web Dev Course</h3>
            <p class="price">$49.99</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>Structural Guide</h3>
            <p class="price">$39.99</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>CAD Software Tool</h3>
            <p class="price">$89.99</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>Git Workflow Kit</h3>
            <p class="price">$19.99</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>CSS Masterclass</h3>
            <p class="price">$29.99</p>
            <button>Buy Now</button>
        </div>
        <div class="product-card">
            <img src="images/laptop.jpg" alt="Product">
            <h3>Engineering Handbook</h3>
            <p class="price">$59.99</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
